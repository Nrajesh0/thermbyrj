name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/build.gradle.kts'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from app/build.gradle.kts
        id: extract_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo " Extracted versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VERSION_NAME}" >> $GITHUB_OUTPUT

          # Check if tag already exists when triggered by push
          if [ "${{ github.event_name }}" = "push" ]; then
            if git rev-parse "v${VERSION_NAME}" >/dev/null 2>&1; then
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "Tag v${VERSION_NAME} already exists; skipping duplicate release creation."
            else
              echo "should_release=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Prepare Keystore (Release Secret or Debug Fallback)
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks
            echo "Using custom release keystore."
          elif [ -f "debug.keystore" ]; then
            cp debug.keystore keystore.jks
            echo "Using repository keystore fallback."
          fi

      - name: Build Signed APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD != '' && secrets.KEY_STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'android' }}
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk "release-artifacts/Therm-v${{ steps.extract_version.outputs.version_name }}-b${{ steps.extract_version.outputs.version_code }}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: therm-v${{ steps.extract_version.outputs.version_name }}-apk
          path: release-artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release & Attach APK
        if: steps.extract_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || steps.extract_version.outputs.tag_name }}
          name: Release v${{ steps.extract_version.outputs.version_name }} (Build ${{ steps.extract_version.outputs.version_code }})
          files: release-artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
